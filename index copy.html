<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <title>Caua Pirilo Asquino</title>
    <style>
        /* Remove margens e define fundo preto */
        body {
            margin: 0;
            overflow: hidden; /* Impede barras de rolagem */
            background-color: black;
        }
    </style>
</head>
<body>

<script>
    // Configuração do jogo Phaser para ocupar a tela inteira
    var config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,
        scene: {
            preload: preload, // Carrega os recursos
            create: create,   // Cria os elementos
            update: update    // Atualiza o jogo
        }
    };


    var game = new Phaser.Game(config);
    var passarinho;

    function preload() {
        // Carrega as imagens
        this.load.image('bg', 'assets/bg_space1.png');
        this.load.spritesheet('passaro', 'assets/bird-green.png', { frameWidth: 75, frameHeight: 75 });
    }

    function create() {
        // Centraliza o fundo e ajusta a escala para cobrir toda a tela
        this.add.image(window.innerWidth / 2, window.innerHeight / 2, 'bg').setScale(0.6);

        // Adiciona o passarinho no centro da tela
        passarinho = this.add.sprite(window.innerWidth / 2, window.innerHeight / 2, 'passaro').setScale(1.3);

        // Animação do passarinho
        this.anims.create({
            key: 'fly',
            frames: this.anims.generateFrameNumbers('passaro', { start: 0, end: 7 }),
            frameRate: 10,
            repeat: -1
        });

        passarinho.anims.play('fly', true);

        // Define direções iniciais para o movimento
        passarinho.direcaoX = 1;
        passarinho.direcaoY = 1;

        // Evento para redimensionar o jogo quando a janela for redimensionada
        window.addEventListener('resize', resizeGame);
    }

    function update() {
        // Movimento horizontal
        for (let i = 0; i < 1; i++) { 
            passarinho.x += 5 * passarinho.direcaoX;

            if (passarinho.x >= window.innerWidth - 100) {
                passarinho.direcaoX = -1;
                passarinho.setFlip(true, false);
            }
            if (passarinho.x <= 100) {
                passarinho.direcaoX = 1;
                passarinho.setFlip(false, false);
            }
        }

        // Movimento vertical
        let mover = true;
        while (mover) {
            passarinho.y += 3 * passarinho.direcaoY;

            if (passarinho.y >= window.innerHeight - 100) {
                passarinho.direcaoY = -1;
            }
            if (passarinho.y <= 100) {
                passarinho.direcaoY = 1;
            }
            mover = false;
        }
    }

    function resizeGame() {
        game.scale.resize(window.innerWidth, window.innerHeight);
    }
</script>

</body>
</html>
